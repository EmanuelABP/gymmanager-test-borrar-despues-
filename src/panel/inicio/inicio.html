<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymManager - Panel de gestión</title>

  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../panel.css">
  <link rel="stylesheet" href="./inicio.css">
</head>
<body>
  <div class="estructura-panel">
    <!-- Menú compartido por las pantallas de gestión. -->
    <aside class="barra-lateral">
      <a class="marca-panel" href="./inicio.html">GymManager</a>

      <nav class="menu-panel" aria-label="Menú de gestión">
        <a href="./inicio.html" class="opcion-menu" aria-current="page">
          Inicio
        </a>

        <button class="opcion-menu" type="button" disabled>
          Clientes
        </button>

        <button class="opcion-menu" type="button" disabled>
          Ejercicios
        </button>

        <button class="opcion-menu" type="button" disabled>
          Rutinas
        </button>

        <button class="opcion-menu" type="button" disabled>
          Turnos
        </button>

        <button class="opcion-menu" type="button"
          data-solo-admin disabled>
          Pagos
        </button>
      </nav>

      <button id="boton-cerrar-sesion" class="boton-cerrar-sesion"
        type="button" disabled>
        Cerrar sesión
      </button>
    </aside>

    <div class="zona-principal">
      <header class="encabezado-panel">
        <div>
          <h1>Panel de gestión</h1>
          <p>Organizá la actividad de tu gimnasio.</p>
        </div>

        <div class="cuenta-panel">
          <span id="nombre-personal"></span>
          <span id="rol-personal" class="etiqueta-rol"></span>
        </div>
      </header>

      <main class="contenido-panel">
        <p id="mensaje-panel" class="mensaje-panel" role="status"></p>

        <!-- El TypeScript habilitará esta sección para ADMIN. -->
        <section id="resumen-administrador"
          aria-labelledby="titulo-resumen" hidden>

          <h2 id="titulo-resumen">Resumen del gimnasio</h2>

          <div class="indicadores-panel">
            <article class="tarjeta-indicador">
              <h3>Clientes activos</h3>
              <p id="cantidad-clientes" class="valor-indicador">—</p>
            </article>

            <article class="tarjeta-indicador">
              <h3>Cuotas vencidas</h3>
              <p id="cantidad-vencidas" class="valor-indicador">—</p>
            </article>

            <article class="tarjeta-indicador">
              <h3>Cuotas próximas a vencer</h3>
              <p id="cantidad-proximas" class="valor-indicador">—</p>
            </article>

            <article class="tarjeta-indicador">
              <h3>Ocupación de turnos</h3>
              <p id="ocupacion-turnos" class="valor-indicador">—</p>
            </article>

            <article class="tarjeta-indicador">
              <h3>Ingresos del mes</h3>
              <p id="ingresos-mes" class="valor-indicador">—</p>
            </article>
          </div>
        </section>

        <!-- Inicio orientado al trabajo del entrenador. -->
        <section id="resumen-entrenador"
          aria-labelledby="titulo-entrenador" hidden>

          <h2 id="titulo-entrenador">Tu espacio de trabajo</h2>
          <p>
            Consultá los clientes y organizá sus rutinas y turnos.
          </p>
        </section>
      </main>
    </div>
  </div>

  <script type="module" src="./inicio.ts"></script>
</body>
</html>
