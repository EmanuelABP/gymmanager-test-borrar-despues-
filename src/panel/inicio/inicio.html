<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087ca7">
    <title>GymManager · Inicio</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../panel.css">
    <link rel="stylesheet" href="../modulos.css">
    <link rel="stylesheet" href="./inicio.css">
  </head>
  <body>
    <div id="vista" hidden>
      <section class="tarjeta">
        <p class="sobre-titulo">BIENVENIDO A GYMMANAGER</p>
        <h2 id="saludo">
        </h2>
        <p id="descripcion-inicio" class="ayuda">
        </p>
      </section>
      <div id="indicadores" class="indicadores">
      </div>
      <div id="accesos" class="acciones">
      </div>
      <section id="reportes" class="dos-columnas" hidden>
        <div class="tarjeta">
          <h2>Cuotas vencidas</h2>
          <div id="vencidas">
          </div>
        </div>
        <div class="tarjeta">
          <h2>Vencen en los próximos 7 días</h2>
          <div id="proximas">
          </div>
        </div>
        <div class="tarjeta">
          <h2>Clientes sin cuota registrada</h2>
          <div id="sin-cuota">
          </div>
        </div>
        <div class="tarjeta">
          <h2>Ocupación de turnos</h2>
          <div id="ocupacion">
          </div>
        </div>
      </section>
      <section id="agenda-entrenador" class="tarjeta" hidden>
        <h2>Mis turnos semanales</h2>
        <div id="mis-turnos" class="lista-detalle">
        </div>
      </section>
    </div>
    <script type="module" src="./inicio.ts">
    </script>
  </body>
</html>
