<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087ca7">
    <title>GymManager · Mi perfil</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="/src/panel/panel.css">
    <link rel="stylesheet" href="/src/panel/modulos.css">
    <link rel="stylesheet" href="./perfil.css">
  </head>
  <body>
    <div id="vista" hidden>
      <section class="tarjeta">
        <p class="sobre-titulo">MI ESPACIO</p>
        <h2 id="nombre-cliente">
        </h2>
        <p id="correo-cliente" class="ayuda">
        </p>
        <p id="estado-ficha">
        </p>
      </section>
      <div class="dos-columnas">
        <section class="tarjeta">
          <div class="barra-seccion">
            <h2>Mi rutina vigente</h2>
            <button id="imprimir" class="boton secundario" type="button" hidden>Imprimir</button>
          </div>
          <div id="rutina">
          </div>
        </section>
        <div class="lista-detalle no-imprimir">
          <section class="tarjeta">
            <h2>Mis turnos</h2>
            <div id="turnos">
            </div>
          </section>
          <section class="tarjeta">
            <h2>Historia clínica</h2>
            <p>Antecedentes, lesiones y observaciones para acompañar tu entrenamiento. Completarla es opcional.</p>
            <div id="acceso-historia">
            </div>
          </section>
        </div>
      </div>
    </div>
    <script type="module" src="./perfil.ts">
    </script>
  </body>
</html>
