<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#087ca7">
    <title>GymManager · Clientes</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../panel.css">
    <link rel="stylesheet" href="../modulos.css">
    <link rel="stylesheet" href="./clientes.css">
  </head>
  <body>
    <div id="vista" hidden>
      <section class="tarjeta" id="tarjeta-alta" hidden>
        <h2>Nueva ficha de cliente</h2>
        <form id="formulario-cliente" class="formulario" novalidate>
          <input name="clienteId" type="hidden">
          <label class="campo">Nombre *<input name="nombre" type="text" required maxlength="100">
          </label>
          <label class="campo">Apellido *<input name="apellido" type="text" required maxlength="100">
          </label>
          <label class="campo">DNI *<input name="dni" type="text" required maxlength="20" inputmode="numeric">
          </label>
          <label class="campo">Fecha de nacimiento<input name="fechaNacimiento" type="date" >
          </label>
          <label class="campo">Teléfono<input name="telefono" type="tel" maxlength="30">
          </label>
          <label class="campo">Correo de contacto<input name="email" type="email" maxlength="254">
          </label>
          <label class="campo">Dirección<input name="direccion" type="text" maxlength="300">
          </label>
          <label class="campo">Contacto de emergencia: nombre<input name="emergenciaNombre" type="text" maxlength="100">
          </label>
          <label class="campo">Teléfono de emergencia<input name="emergenciaTelefono" type="tel" maxlength="30">
          </label>
          <label class="campo">Relación con el cliente<input name="emergenciaRelacion" type="text" maxlength="100">
          </label>
          <p class="ayuda ancho">* Obligatorios. El correo de contacto no modifica la cuenta de acceso.</p>
          <div class="acciones">
            <button id="guardar-cliente" class="boton" type="submit">Crear cliente</button>
            <button id="cancelar-edicion" class="boton secundario" type="button" hidden>Cancelar edición</button>
          </div>
        </form>
      </section>
      <section class="tarjeta" id="tarjeta-vinculo" hidden>
        <h2>Vincular una cuenta registrada</h2>
        <p id="cliente-elegido">
        </p>
        <form id="formulario-vinculo" class="formulario" novalidate>
          <input name="clienteId" type="hidden">
          <label class="campo">Correo de la cuenta *<input name="correoCuenta" type="email" required maxlength="254">
          </label>
          <label class="ancho">
            <input name="confirmado" type="checkbox" required> Verifiqué que la cuenta pertenece a este cliente.</label>
          <div class="acciones">
            <button class="boton" type="submit">Vincular cuenta</button>
            <button class="boton secundario" type="reset">Limpiar</button>
          </div>
        </form>
      </section>
      <section class="tarjeta">
        <h2>Fichas del gimnasio</h2>
        <div class="barra-seccion">
          <label>Buscar por nombre, DNI o contacto <input id="buscar" class="buscador" type="search" placeholder="Buscar cliente…">
          </label>
          <label>Estado <select id="filtro-estado">
              <option value="todos">Todos</option>
              <option value="activos">Activos</option>
              <option value="inactivos">Inactivos</option>
            </select>
          </label>
          <button id="actualizar" class="boton secundario" type="button">Actualizar</button>
        </div>
        <div id="listado">
        </div>
      </section>
    </div>
    <script type="module" src="./clientes.ts">
    </script>
  </body>
</html>
